<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Quota Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="card">
    <header id="bar">
      <span class="title" data-i18n="app.title"></span>
      <span class="spacer"></span>
      <button id="btn-refresh" data-i18n-title="btn.refresh">↻</button>
      <button id="btn-pin" data-i18n-title="btn.pin">📌</button>
      <button id="btn-config" data-i18n-title="btn.config">⚙</button>
      <button id="btn-hide" data-i18n-title="btn.hide">✕</button>
    </header>
    <section id="list"></section>
    <section id="settings" hidden></section>
    <footer id="foot"></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
