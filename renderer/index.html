<!doctype html>
<html lang="en-US" data-skin="classic">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Quota Widget</title>
  <link rel="stylesheet" href="style.css" />
  <link id="skin-css" rel="stylesheet" href="skins/classic.css" />
</head>
<body>
  <main id="card">
    <header id="bar">
      <span class="title" data-i18n="app.title"></span>
      <span class="spacer"></span>
      <button id="btn-refresh" data-i18n-title="btn.refresh" aria-keyshortcuts="Control+R">↻</button>
      <button id="btn-pin" data-i18n-title="btn.pin" aria-pressed="false" aria-keyshortcuts="Control+Shift+P">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M16 9V4h1V2H7v2h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
      </button>
      <button id="btn-config" data-i18n-title="btn.config" aria-keyshortcuts="Control+,">⚙</button>
      <button id="btn-hide" data-i18n-title="btn.hide">✕</button>
    </header>
    <section id="list"></section>
    <section id="settings" hidden></section>
    <footer id="foot"></footer>
  </main>
  <script src="i18n.js"></script>
  <script src="custom-spec.js"></script>
  <script src="provider-state.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
